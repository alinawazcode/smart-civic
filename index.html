    <script>
      // Defensive guard for browser extensions (interceptors) attempting to overwrite window.fetch
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = function() {
            return (_rawFetch || window.fetch).apply(this, arguments);
          };
          if (typeof _rawFetch === 'function') {
            _currentFetch = _rawFetch.bind(window);
          }
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_err) {
          // Fallback if property is non-configurable
        }
      })();
    </script>
